name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django: ["4.2", "5.1", "5.2", "6.0", "6.1"]
        exclude:  # Django 6 needs Python 3.12+; Python 3.14 needs Django 5.2.8+
          - {python: "3.10", django: "6.0"}
          - {python: "3.10", django: "6.1"}
          - {python: "3.11", django: "6.0"}
          - {python: "3.11", django: "6.1"}
          - {python: "3.14", django: "4.2"}
          - {python: "3.14", django: "5.1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No system libraries: PDF output uses the typst wheel and bundled fonts.
      - name: Install
        run: |
          pip install "Django~=${{ matrix.django }}.0"
          pip install -e ".[dev]"
      - name: Test
        run: pytest

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
          npm run contract
      - name: Built bundle is committed and up to date
        run: git diff --exit-code -- src/templates_pro/static/templates_pro/editor tests/fixtures

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff && ruff check .

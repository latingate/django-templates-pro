[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "django-templates-pro"
dynamic = ["version"]
description = "WYSIWYG document templates for Django: variables, constants, dynamic values, formatting and shared blocks, rendered to HTML, PDF, DOCX and TXT, with right-to-left (Hebrew, Arabic) support. Pure pip: no system libraries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Peltransport" }]
keywords = ["django", "templates", "wysiwyg", "tiptap", "jinja2", "pdf", "docx", "typst", "rtl", "hebrew", "mail-merge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: HTML",
]
# Every dependency ships as a wheel for Windows, macOS and Linux: no system libraries.
dependencies = [
    "Django>=4.2",
    "Jinja2>=3.1",
    "Babel>=2.12",
    "html2text>=2024.2.26",
    "typst>=0.13",        # PDF engine (compiler bundled in the wheel)
    "python-docx>=1.1",   # DOCX output
]

[project.optional-dependencies]
# Optional second PDF engine (full CSS). Needs the Pango system library.
weasyprint = ["weasyprint>=60"]
# Kept so 0.1.x install commands keep working; PDF and DOCX are now always included.
pdf = []
docx = []
all = []
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pypdf>=4",
    "nox>=2024.3",
    "ruff>=0.5",
]

[project.urls]
Documentation = "https://github.com/latingate/django-templates-pro/tree/master/docs"
Source = "https://github.com/latingate/django-templates-pro"
Changelog = "https://github.com/latingate/django-templates-pro/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "src/templates_pro/__init__.py"

[project.scripts]
templates-pro-demo = "templates_pro.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/templates_pro"]
exclude = ["**/db.sqlite3", "**/__pycache__", "**/*.pyc", "**/.DS_Store", "**/media", "**/staticfiles"]

# The demo website, for `python -m templates_pro.demo` (DOC_FILES in templates_pro/demo/__init__.py).
[tool.hatch.build.targets.wheel.force-include]
"example" = "templates_pro/demo/project"
"README.md" = "templates_pro/demo/project/_docs/README.md"
"SETUP.md" = "templates_pro/demo/project/_docs/SETUP.md"
"CHANGELOG.md" = "templates_pro/demo/project/_docs/CHANGELOG.md"
"docs" = "templates_pro/demo/project/_docs/docs"
"example/README.md" = "templates_pro/demo/project/_docs/example/README.md"
"frontend/README.md" = "templates_pro/demo/project/_docs/frontend/README.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "frontend/src", "frontend/scripts", "frontend/package.json", "frontend/package-lock.json", "frontend/vite.config.js", "frontend/README.md", "example", "README.md", "SETUP.md", "CHANGELOG.md", "LICENSE", "noxfile.py", "requirements*.txt"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["frontend", "src/templates_pro/migrations"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "B", "UP", "DJ", "PLW1514"]  # PLW1514: always pass encoding=
# DJ007: admin ModelForms intentionally expose all fields; DJ012: method order is by topic.
ignore = ["DJ007", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"example/**" = ["E501", "DJ008"]
"tests/**" = ["E501"]
"src/templates_pro/__init__.py" = ["F822"]  # lazy re-exports via __getattr__
